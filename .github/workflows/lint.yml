#
# Runs tools/check.sh: the static lint of the SQL*Plus sources (lint.sh),
# bash -n on every tracked *.sh, a strict parse of every tracked *.py and
# the server unit tests. None of these needs a database.
#
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tools/check.sh (lint, shell syntax, Python parse, server tests)
        run: ./tools/check.sh
